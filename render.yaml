services:
  - type: web
    name: sentinel-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    # Build only the API server — skips full workspace typecheck that fails on Render
    buildCommand: "corepack enable && corepack prepare pnpm@9.15.4 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server build"
    startCommand: "node artifacts/api-server/dist/index.mjs"
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: SERVER_SECRET
        generateValue: true
